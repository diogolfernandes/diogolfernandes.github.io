<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cidade</title>

    <style>
      .fotografias {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
      }
      .fotografias img {
        width: 150px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Óbidos</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="local.html">Localização</a>
        <a href="multimedia.html">Multimédia</a>
        <a href="info.html">Informação</a>
      </nav>
    </header>

    <main>
      <h2>Multimédia</h2>
      <p>Nesta página encontra-se conteúdos multimédia</p>
      <section>
        <h3>Fotografias</h3>
        <div class="fotografias">
          <img src="../images/buracoMuralha.jpg" alt="Buraco na muralha" />
          <img
            src="../images/casteloDentroTopView.jpg"
            alt="Top view dentro das muralhas"
          />
          <img src="../images/casteloObidos.jpg" alt="castelo de Obidos" />
          <img src="../images/lagoaBarcos.jpg" alt="bascos na lagoa" />
          <img src="../images/lagoaDeObidos.jpg" alt="lagoa de Obidos" />
          <img src="../images/muralhaEmCima.jpg" alt="muralha" />
          <img src="../images/ruaObidos.jpg" alt="rua" />
          <img src="../images/senhorDaPedra.jpg" alt="senhor da pedra" />
        </div>
      </section>
      <section>
        <h3>Vídeo</h3>
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/Jv0UrBwQmhc?si=iTmpMFB9l06LoXoU"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </section>
    </main>

    <footer>
      <p>DIW 2026</p>
    </footer>
  </body>
</html>
